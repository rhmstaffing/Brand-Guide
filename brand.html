<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.l{font-size:11px;color:var(--text-muted);line-height:1.35}.n{font-size:12px;font-weight:600;color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div><div style="height:80px;border-radius:6px;background:var(--rhm-ink);"></div><div class="n" style="margin-top:6px">Ink</div><div class="l">--rhm-ink<br>#060F1A</div></div><div><div style="height:80px;border-radius:6px;background:var(--rhm-navy);"></div><div class="n" style="margin-top:6px">Navy</div><div class="l">--rhm-navy<br>#02195C</div></div><div><div style="height:80px;border-radius:6px;background:var(--rhm-blue);"></div><div class="n" style="margin-top:6px">RHM Blue</div><div class="l">--rhm-blue<br>#084FA3</div></div><div><div style="height:80px;border-radius:6px;background:var(--rhm-sky);"></div><div class="n" style="margin-top:6px">Sky</div><div class="l">--rhm-sky<br>#52C0E4</div></div><div><div style="height:80px;border-radius:6px;background:var(--rhm-silver);"></div><div class="n" style="margin-top:6px">Silver</div><div class="l">--rhm-silver<br>#BEC3C8</div></div></div></body></html>
