<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.l{font-size:11px;color:var(--text-muted);line-height:1.35}.n{font-size:12px;font-weight:600;color:var(--text-strong)}</style></head><body><div style="display:flex;gap:18px"><div style="text-align:center"><div style="width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--rhm-blue);border-radius:var(--radius-none)"></div><div class="n" style="margin-top:6px">none</div><div class="l">0</div></div><div style="text-align:center"><div style="width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--rhm-blue);border-radius:var(--radius-xs)"></div><div class="n" style="margin-top:6px">xs</div><div class="l">2px</div></div><div style="text-align:center"><div style="width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--rhm-blue);border-radius:var(--radius-sm)"></div><div class="n" style="margin-top:6px">sm</div><div class="l">4px</div></div><div style="text-align:center"><div style="width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--rhm-blue);border-radius:var(--radius-md)"></div><div class="n" style="margin-top:6px">md</div><div class="l">8px</div></div><div style="text-align:center"><div style="width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--rhm-blue);border-radius:var(--radius-lg)"></div><div class="n" style="margin-top:6px">lg</div><div class="l">14px</div></div><div style="text-align:center"><div style="width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--rhm-blue);border-radius:var(--radius-pill)"></div><div class="n" style="margin-top:6px">pill</div><div class="l">999px</div></div></div></body></html>
