<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.l{font-size:11px;color:var(--text-muted);line-height:1.35}.n{font-size:12px;font-weight:600;color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div><div style="height:54px;border-radius:6px;background:var(--sky-50);"></div><div class="n" style="margin-top:6px">50</div><div class="l">--sky-50<br></div></div><div><div style="height:54px;border-radius:6px;background:var(--sky-100);"></div><div class="n" style="margin-top:6px">100</div><div class="l">--sky-100<br></div></div><div><div style="height:54px;border-radius:6px;background:var(--sky-200);"></div><div class="n" style="margin-top:6px">200</div><div class="l">--sky-200<br></div></div><div><div style="height:54px;border-radius:6px;background:var(--sky-300);"></div><div class="n" style="margin-top:6px">300</div><div class="l">--sky-300<br></div></div><div><div style="height:54px;border-radius:6px;background:var(--sky-400);"></div><div class="n" style="margin-top:6px">400</div><div class="l">--sky-400<br></div></div><div><div style="height:54px;border-radius:6px;background:var(--sky-500);"></div><div class="n" style="margin-top:6px">500</div><div class="l">--sky-500<br></div></div></div></body></html>
