<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Success, warning, error, info with soft backgrounds" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.l{font-size:11px;color:var(--text-muted);line-height:1.35}.n{font-size:12px;font-weight:600;color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div><div style="background:var(--status-success-bg);color:var(--status-success);border-radius:6px;padding:14px 12px;font-weight:600;font-size:14px">Placed</div><div class="l" style="margin-top:6px">--status-success<br>--status-success-bg</div></div><div><div style="background:var(--status-warning-bg);color:var(--status-warning);border-radius:6px;padding:14px 12px;font-weight:600;font-size:14px">Pending</div><div class="l" style="margin-top:6px">--status-warning<br>--status-warning-bg</div></div><div><div style="background:var(--status-error-bg);color:var(--status-error);border-radius:6px;padding:14px 12px;font-weight:600;font-size:14px">Missing docs</div><div class="l" style="margin-top:6px">--status-error<br>--status-error-bg</div></div><div><div style="background:var(--status-info-bg);color:var(--status-info);border-radius:6px;padding:14px 12px;font-weight:600;font-size:14px">In review</div><div class="l" style="margin-top:6px">--status-info<br>--status-info-bg</div></div></div></body></html>
