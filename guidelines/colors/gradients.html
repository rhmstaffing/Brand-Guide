<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.l{font-size:11px;color:var(--text-muted);line-height:1.35}.n{font-size:12px;font-weight:600;color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div><div style="height:80px;border-radius:6px;background:var(--gradient-deep)"></div><div class="n" style="margin-top:6px">Deep</div><div class="l">--gradient-deep</div></div><div><div style="height:80px;border-radius:6px;background:var(--gradient-bright)"></div><div class="n" style="margin-top:6px">Bright</div><div class="l">--gradient-bright</div></div><div><div style="height:80px;border-radius:6px;background:var(--gradient-protect),url(../../assets/backgrounds/grain-cyan-streak.jpg) center/cover"></div><div class="n" style="margin-top:6px">Protect (over image)</div><div class="l">--gradient-protect</div></div></div></body></html>
