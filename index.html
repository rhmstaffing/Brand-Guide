<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script>window.RHM=window.RHMStaffingDesignSystem_7f6616;window.A='../../assets/';</script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ClientsScreen.jsx"></script>
<script type="text/babel" src="ContractorsScreen.jsx"></script>

<script type="text/babel" src="ContactScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState(()=>localStorage.getItem('rhm-kit-page')||'home');
  const [toast,setToast]=React.useState(null);
  const go=p=>{setPage(p);localStorage.setItem('rhm-kit-page',p);window.scrollTo(0,0)};
  const notify=t=>{setToast(t);setTimeout(()=>setToast(null),3200)};
  const S={home:HomeScreen,clients:ClientsScreen,contractors:ContractorsScreen,careers:CareersScreen,contact:ContactScreen}[page]||HomeScreen;
  const {Toast}=window.RHM;
  return <div><SiteHeader page={page} go={go}/><S go={go} notify={notify}/><SiteFooter go={go}/>
    {toast&&<div style={{position:'fixed',right:24,bottom:24,zIndex:2000}}><Toast tone="success" title={toast.title} onClose={()=>setToast(null)}>{toast.body}</Toast></div>}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(window.RHM?<App/>:<div style={{padding:40,fontFamily:'var(--font-body)'}}>Design system bundle not loaded. Check that _ds_bundle.js exists at the project root.</div>);
</script></body></html>
