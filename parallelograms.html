<!-- @dsCard group="Brand" viewport="700x250" name="Parallelograms" subtitle="Angled cuts lean like the logo diagonals. Text is left aligned, follows the slant, 15px clear on all sides." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;font-family:var(--font-body)}
.r{display:grid;grid-template-columns:1fr 1.15fr 1.15fr;gap:12px;padding:18px 22px;height:250px;box-sizing:border-box}
.img{clip-path:polygon(0 0,calc(100% - 48px) 0,100% 100%,48px 100%);background:url(../../assets/backgrounds/grain-cobalt-glow.jpg) center/cover}
.col{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-width:0}
.t{--o:30px;height:100%;box-sizing:border-box;clip-path:polygon(0 0,calc(100% - var(--o)) 0,100% 100%,var(--o) 100%);padding:15px;color:#fff;text-align:left}
.t>.sl{float:left;width:var(--o);height:100%;shape-outside:polygon(0 0,0 0,100% 100%,0 100%)}
.t>.sr{float:right;width:var(--o);height:100%;shape-outside:polygon(0 0,100% 0,100% 100%,100% 100%)}
.k{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--rhm-sky)}
.h{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.2;margin-top:4px}
.p{font-size:12.5px;line-height:1.4;margin-top:6px;color:#C9D6E6}
</style></head><body><div class="r">
<div class="img"></div>
<div class="col">
<div class="t" style="background:var(--rhm-blue)"><i class="sl"></i><i class="sr"></i><div class="k">Temp to hire</div><div class="h">Test the fit first.</div></div>
<div class="t" style="background:var(--rhm-navy)"><i class="sl"></i><i class="sr"></i><div class="k">Direct hire</div><div class="h">We screen. You hire.</div></div>
</div>
<div class="t" style="--o:40px;background:var(--rhm-ink)"><i class="sl"></i><i class="sr"></i><div class="k">Angled band</div><div class="h">Each line starts further right, tracking the slant.</div><div class="p">Left aligned. 15px clear of every edge.</div></div>
</div></body></html>
