<script type="text/babel">

<Note tone="light" t="Interview set" m="Tue 10:00, Rockford office" icon="screening-interview"/>
</div>

<LiquidGlass shape="pill" tone="light" interactive style={{fontWeight:600,fontSize:15}}>For clients</LiquidGlass>
<div style={{display:'flex',gap:10}}>{['menu','search','phone'].map((i,k)=><LiquidGlass key={i} shape="circle" tone={['dark','brand','light'][k]} interactive style={{width:48,height:48,display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name={i} size={20}/></LiquidGlass>)}</div>
</div>
<LiquidGlass shape="pill" style={{position:'absolute',right:24,bottom:24,display:'flex',gap:16,padding:'10px 20px',fontSize:14,fontWeight:500,whiteSpace:'nowrap'}}><span style={{fontWeight:600}}>Home</span><span style={{opacity:.75}}>Clients</span><span style={{opacity:.75}}>Contractors</span><span style={{opacity:.75}}>Careers</span></LiquidGlass>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
