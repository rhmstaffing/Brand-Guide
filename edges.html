<div><div class="b"><img src="../../assets/backgrounds/fluid-blue-wave.png" class="rhm-fade-edges" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover" alt=""></div><div class="k ok">Do: fade edges (--mask-fade-edges)</div></div>
<div><div class="b"><img src="../../assets/lines/wave-white-02.png" style="position:absolute;left:-30%;top:-20%;width:170%;height:150%;object-fit:cover" alt=""></div><div class="k ok">Do: bleed edge to edge</div></div></div></body></html>
